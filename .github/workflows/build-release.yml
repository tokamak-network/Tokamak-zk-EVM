name: Pre-publish Test & Build

on:
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: pre-publish-test-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Source build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      QAP_COMPILER_EXPECTED_CIRCOM_VERSION: '2.2.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix packages/backend/wasm --ignore-scripts

      - name: Fetch pull-request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA"

      - name: Check release-candidate date boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run release:candidate:check -- --base-ref="$BASE_SHA"

      - name: Check public documentation
        run: npm run docs:check

      - name: Check synchronized versions
        run: npm run version:check

      - name: Install Rust and Cargo
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Circom compiler
        run: cargo install --locked --git https://github.com/iden3/circom --tag v2.2.3 circom

      - name: Verify Circom compiler
        run: |
          test "$(circom --version)" = "circom compiler 2.2.3"

      - name: Build subcircuit library
        working-directory: packages/frontend/qap-compiler
        run: |
          npx qap-compiler --reload-constants
          npx qap-compiler --build
          npx qap-compiler --dist

      - name: Build synthesizer packages
        run: npm run build --workspace @tokamak-zk-evm/synthesizer-node

      - name: Build synthesizer web package
        run: npm run build --workspace @tokamak-zk-evm/synthesizer-web

      - name: Build CLI package
        run: npm run build --workspace @tokamak-zk-evm/cli

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install ICICLE CPU runtime
        working-directory: packages/backend
        run: ./download-ICICLE-lib.sh

      - name: Generate local verifier key
        working-directory: packages/backend
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/packages/backend/external-lib/linux22/lib
          ICICLE_BACKEND_INSTALL_DIR: ${{ github.workspace }}/packages/backend/external-lib/linux22/lib/backend
        run: |
          cargo run --locked --release -p trusted-setup -- \
            --subcircuit-library ../frontend/qap-compiler/subcircuits/library \
            --output "$RUNNER_TEMP/tokamak-development-crs"

      - name: Check backend workspace
        working-directory: packages/backend
        run: cargo check --workspace --locked
        env:
          TOKAMAK_VERIFIER_KEYS: ${{ runner.temp }}/tokamak-development-crs/verifier_keys.rkyv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed Drive client
        run: python -m pip install google-api-python-client==2.198.0 google-auth==2.50.0

      - name: Write read-only Drive credential
        env:
          TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/tokamak-mpc-drive-service-account.json"

      - name: Download and hash-check public CRS
        env:
          TOKAMAK_MPC_DRIVE_FOLDER_ID: ${{ vars.TOKAMAK_MPC_DRIVE_FOLDER_ID }}
          TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/tokamak-mpc-drive-service-account.json
        run: |
          version="$(node -p "require('./package.json').version")"
          python scripts/download-release-crs.py --version="$version" --output="$RUNNER_TEMP/tokamak-pr-crs"

      - name: Check CRS against the published subcircuit library
        run: >-
          cargo run --manifest-path packages/backend/Cargo.toml --locked
          --release -p libs --bin check_crs_publication
          --no-default-features --features production-npm-subcircuit-library --
          "$RUNNER_TEMP/tokamak-pr-crs"
