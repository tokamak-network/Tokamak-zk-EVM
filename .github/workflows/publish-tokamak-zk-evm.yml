name: Publish Tokamak zk-EVM packages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokamak-zk-evm-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and validate packages from main
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies and check synchronized versions
        run: |
          npm ci
          npm run version:check
          npm ci --prefix packages/backend/wasm --ignore-scripts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install pinned Circom compiler
        run: cargo install --locked --git https://github.com/iden3/circom --tag v2.2.3 circom

      - name: Build local subcircuit inputs for Synthesizer
        working-directory: packages/frontend/qap-compiler
        run: |
          test "$(circom --version)" = "circom compiler 2.2.3"
          npx qap-compiler --reload-constants
          npx qap-compiler --build

      - name: Build Synthesizer and CLI packages
        run: |
          npm run build --workspace @tokamak-zk-evm/synthesizer-node
          npm run build --workspace @tokamak-zk-evm/synthesizer-web
          npm run --workspace @tokamak-zk-evm/cli release:package:check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed Drive client
        run: python -m pip install google-api-python-client==2.198.0 google-auth==2.50.0

      - name: Write read-only Drive credential
        env:
          TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/tokamak-mpc-drive-service-account.json"

      - name: Download and hash-check public CRS
        env:
          TOKAMAK_MPC_DRIVE_FOLDER_ID: ${{ vars.TOKAMAK_MPC_DRIVE_FOLDER_ID }}
          TOKAMAK_MPC_DRIVE_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/tokamak-mpc-drive-service-account.json
        run: |
          mkdir -p packages/backend/rust/setup/output/generations
          version="$(node -p "require('./package.json').version")"
          python scripts/download-release-crs.py --version="$version" --output=packages/backend/rust/setup/output/generations/main-crs
          ln -s generations/main-crs packages/backend/rust/setup/output/crs

      - name: Check CRS against the published subcircuit library
        run: >-
          cargo run --manifest-path packages/backend/Cargo.toml --locked
          --release -p libs --bin check_crs_publication
          --no-default-features --features production-npm-subcircuit-library --
          packages/backend/rust/setup/output/crs

      - name: Build and check browser package
        working-directory: packages/backend/wasm
        env:
          BACKEND_WASM_VERIFIER_CRS_DIR: ../rust/setup/output/crs
        run: |
          npm run build:production
          npm run verifier-crs:input:validate
          npm run package:publication:check

      - name: Check production snapshot
        run: npm run version:production-snapshot:check

      - name: Pack dependent packages
        run: |
          mkdir package-tarballs
          npm pack ./packages/frontend/synthesizer/node-cli --pack-destination package-tarballs --ignore-scripts
          npm pack ./packages/frontend/synthesizer/web-app --pack-destination package-tarballs --ignore-scripts
          npm pack ./packages/cli --pack-destination package-tarballs --ignore-scripts
          npm pack ./packages/backend/wasm --pack-destination package-tarballs --ignore-scripts

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: tokamak-zk-evm-package-tarballs
          path: package-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish missing packages
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org

      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Download validated package tarballs
        uses: actions/download-artifact@v4
        with:
          name: tokamak-zk-evm-package-tarballs
          path: package-tarballs

      - name: Publish absent exact versions in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package_name in \
            @tokamak-zk-evm/synthesizer-node \
            @tokamak-zk-evm/synthesizer-web \
            @tokamak-zk-evm/cli \
            @tokamak-zk-evm/snark-browser-compat; do
            decision="$(node scripts/check-release-package.mjs --package-name="$package_name" --tarball-dir=package-tarballs)"
            should_publish="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).should_publish)' "$decision")"
            if [ "$should_publish" = true ]; then
              current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
              if [ "$current_head" != "$GITHUB_SHA" ]; then
                echo "Publication stopped: main advanced beyond $GITHUB_SHA." >&2
                exit 1
              fi
              tarball="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).tarball)' "$decision")"
              npm publish --access public --ignore-scripts "$tarball"
            fi
          done
