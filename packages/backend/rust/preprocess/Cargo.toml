[package]
name = "preprocess"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }

[dependencies]
libs = { workspace = true, default-features = false }
clap = { workspace = true }
thiserror = { workspace = true }
backend-interface = { workspace = true }
backend-univariate-crs-interface = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true, features = ["parallel"] }
ark-ff = { workspace = true, features = ["parallel"] }
ark-poly = { version = "0.5.0", features = ["parallel"] }
rayon = { workspace = true }
hex = { workspace = true }
icicle-runtime = { workspace = true }
icicle-bls12-381 = { workspace = true }
icicle-core = { workspace = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
default = ["local-development-subcircuit-library"]
testing-mode = ["libs/testing-mode"]
development-crs-bypass = ["libs/development-crs-bypass"]
local-development-subcircuit-library = ["libs/local-development-subcircuit-library"]
production-npm-subcircuit-library = ["libs/production-npm-subcircuit-library"]
